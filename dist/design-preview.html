<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VG · 隔离预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#1a2634;color:#d7e6f5;font:13px system-ui,sans-serif}nav{min-height:60px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;padding:8px 10px;border-bottom:1px solid #31465b}nav strong{font-size:13px;font-weight:600}nav small{color:#95aec5}label{cursor:pointer;padding:6px 8px;border-radius:4px;background:#263c52}label:has(input:checked){background:#426381}input{margin:0 4px 0 0}iframe{display:block;margin:14px auto;border:1px solid #42617b;border-radius:8px;width:390px;height:844px;background:#050b15}body:has(#size320:checked) iframe{width:320px;height:740px}body:has(#size430:checked) iframe{width:430px;height:900px}button{border:1px solid #46617b;background:#172a3c;color:#d7e6f5;padding:7px 10px;border-radius:4px;font-size:12px;cursor:pointer}@media(max-width:500px){nav{font-size:11px;gap:7px}iframe{width:100%!important;margin:0;border-radius:0;border:0;height:calc(100dvh - 98px)!important}nav strong,nav small{width:100%;text-align:center}}
</style></head><body><nav aria-label="预览控制"><strong>VG · 原版抽屉优化预览</strong><small>独立测试环境 · 正式站保持原版</small><label><input id="size320" name="size" type="radio">320</label><label><input id="size390" name="size" type="radio" checked>390</label><label><input id="size430" name="size" type="radio">430</label><button id="demo">重载示例对局</button><button id="empty">空白对局</button></nav><iframe title="VG 手机布局" src="/"></iframe><script>
const KEY='VG_DRAWER_PREVIEW_V1';
const demo={units:{front_left:{basePower:10000,powerBuff:5000,grade:2},front_center:{basePower:13000,powerBuff:10000,grade:3,hasDoubleStrike:true},front_right:{basePower:10000,grade:2},back_left:{basePower:8000,grade:1,isSupporting:true},back_center:{basePower:8000,grade:1,isSupporting:true},back_right:{basePower:8000,grade:1,isSupporting:true}},energy:5,resources:{soul:3,damage:2},language:'zh'};
if(!localStorage.getItem(KEY))localStorage.setItem(KEY,JSON.stringify(demo));
document.getElementById('demo').onclick=()=>{localStorage.setItem(KEY,JSON.stringify(demo));document.querySelector('iframe').src='/';};
document.getElementById('empty').onclick=()=>{localStorage.removeItem(KEY);document.querySelector('iframe').src='/';};
</script></body></html>
